name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate Android scaffold and apply app code
        run: |
          flutter create --org com.fokus --project-name fokus_hafalan --platforms android .
          cp app/main.dart lib/main.dart
          mkdir -p android/app/src/main/kotlin/com/fokus/fokus_hafalan
          cp app/MainActivity.kt android/app/src/main/kotlin/com/fokus/fokus_hafalan/MainActivity.kt
          sed -i '/<manifest/a <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY"/>' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
